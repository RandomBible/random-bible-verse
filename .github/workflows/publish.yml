# Publishes the package to npm when a version tag is pushed (git tag v1.0.0 && git push --tags).
#
# Publishing uses npm trusted publishing: npm trusts this workflow through GitHub's OIDC token, so
# no npm token is stored here, and every release carries provenance. The package's trusted
# publisher on npmjs.com is RandomBible/random-bible-verse, publish.yml, environment "npm".
name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # trusted publishing and provenance

jobs:
  npm:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      - run: npm install -g npm@11

      - name: Tag matches package.json version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json $version"
            exit 1
          fi

      # The package has no dependencies, so there is nothing to install.
      - run: npm run build
      - run: npm test --if-present

      - run: npm publish --provenance --access public
